name: Build Cypher APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cypher-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Enable Gradle wrappers
        run: chmod +x ./gradlew ./apps/android/gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs
        run: test -n "$(find apps/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cypher-debug-apks
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
